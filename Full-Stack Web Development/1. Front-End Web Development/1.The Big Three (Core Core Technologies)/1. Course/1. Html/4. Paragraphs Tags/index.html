* FIXME: 4. Paragraphs
    . "A paragraph always starts on a new line and is usually a block of text." 
    . The HTML <p> element defines a paragraph.
    . A paragraph always starts on a new line and browsers automatically add 
        some white space (a margin) before and after a paragraph.  
    . You cannot be sure how HTML will be displayed.
    . Large or small screens and resized windows will create different results.
    . With HTML, you cannot change the display by 
        adding extra spaces or extra lines in your HTML code. 
    . The browser will automatically remove any extra spaces 
        and lines when the page is displayed:  
    ? Example:-
        . <p>This is a paragraph.</p>           
        . <p>This is another paragraph.</p>
* Horizontal Rules
    . The <hr> tag defines a thematic break in an HTML page and 
        is most often displayed as a horizontal rule.  
    . The <hr> element is used to separate content 
        (or define a change) in an HTML page:        
    . The <hr> tag is an empty tag, which means that it has no end tag.  
    ? Example:-
        . <p>This is <hr> some text.</p>
* Line Breaks
    . The HTML <br> element defines a line break.
    . Use <br> if you want a line break (a new line) without starting a new paragraph:
    . The <br> tag is an empty tag, which means that it has no end tag.
    ? Example:-
        . <p>This is <br> a paragraph <br> with line breaks.</p>
* The Poem Problem
    . This poem will display on a single line:
    ? Example:-
        . <p> My Bonnie lies over the ocean.
              My Bonnie lies over the sea. </p>
Solution - The HTML <pre> Element (for Poem)
    . The HTML <pre> element defines preformatted text.
    . The text inside a <pre> element is displayed in a fixed-width font 
        (usually Courier), and it preserves both spaces and line breaks:
    ? Exampel:-
        . <pre> My Bonnie lies over the ocean.
                My Bonnie lies over the sea. </pre>
-->
