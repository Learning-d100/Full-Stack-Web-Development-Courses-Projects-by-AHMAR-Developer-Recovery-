* FIXME: 22. Semantics
    * 3. '<Details>' Element
        . The '<Details>' element is used to create a disclosure widget in HTML. 
        . It allows users to toggle the visibility of additional content, 
            providing a way to hide or show information on demand. 
        . This element is often used for FAQs, collapsible sections, 
            or any content that can be expanded or collapsed.
        . By default, the widget is closed.
        . Any sort of content can be put inside the <details> tag. 
    * 3 '<Summary>' Element
        . The '<Summary>' element is used in conjunction with the '<Details>' 
            element to provide a summary or caption for the content that can 
            be toggled. 
        . It serves as the visible part of the disclosure widget, and when 
            clicked, it reveals or hides the associated content within the 
            '<Details>' element.
        . The '<Summary>' element is typically used to provide a brief 
            description or title for the hidden content, giving users an idea 
            of what they can expect when they expand the details.
-->
