* FIXME: 24. Form
    * 1. Form Attributes:-
        * 1. Accept-Charset
            . The 'accept-charset' attribute specifies the character encodings 
                that are to be used for the form submission.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form accept-charset="value">
            . Attribute Values
                . The 'accept-charset' attribute can have the following values:
                    . A space-separated list of character encodings.
                . Common values:
                    . UTF-8: Unicode Transformation Format - 8-bit
                    . ISO-8859-1: Western European (Latin-1)
                    . In theory, any character encoding can be used, 
                        but no browser understands all of them. 
                    . The more widely a character encoding is used, 
                        the better the chance that a browser will understand it.
        * 2. Action
            . The 'action' attribute specifies where to send the form data 
                when a form is submitted.
            . The action attribute defines the action to be performed when 
                the form is submitted.
            . Usually, the form data is sent to a file on the server when 
                the user clicks on the submit button.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form action="URL">
            . Attribute Values
                . The 'action' attribute can have the following values:
                    . A URL (Uniform Resource Locator) that specifies where 
                        to send the form data.
                    . If the 'action' attribute is omitted, 
                        the form data will be sent to the same page that 
                        the form is on.
            ? Tip: If the action attribute is omitted, 
                ? the action is set to the current page.
        * 3. Autocomplete
            . The 'autocomplete' attribute specifies whether a form or input 
                field should have autocomplete enabled or disabled.
            . When autocomplete is enabled, the browser can suggest and 
                automatically fill in previously entered values for form fields.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form autocomplete="on|off">
            . Attribute Values
                . on: Enables autocomplete for the form or input field.
                . off: Disables autocomplete for the form or input field.
        * 4. Enctype
            . The 'enctype' attribute specifies how the form data should be 
                encoded when it is sent to the server.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form enctype="value">
            . Attribute Values
                . application/x-www-form-urlencoded (default): 
                    . Data is encoded as key-value pairs, 
                        with special characters replaced by percent-encoding.
                . multipart/form-data: 
                    . Used when the form includes file uploads. 
                    . Data is sent in multiple parts, allowing for binary data.
                . text/plain: 
                    . Data is sent as plain text without any encoding. 
                    . Not commonly used and may not be supported by all browsers.
            ? Note: The enctype attribute can be used only if method="post".
        * 5. Method
            . The 'method' attribute specifies the HTTP method to be used 
                when submitting the form data.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form method="get|post">
            . Attribute Values
                . get: 
                    . Appends the form data to the URL in name/value pairs. 
                    . Suitable for non-sensitive data and bookmarking.
                . post: 
                    . Sends the form data in the body of the HTTP request. 
                    . Suitable for sensitive data and larger amounts of data.
        * 6. Name
            . The 'name' attribute specifies the name of the form or input field.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form name="value">
            . Attribute Values
                . A string that represents the name of the form or input field.
        * 7. Target
            . The 'target' attribute specifies where to display the response 
                after submitting the form.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form target="value">
            . Attribute Values
                . _self: Opens the response in the same frame or window (default).
                . _blank: Opens the response in a new window or tab.
                . _parent: Opens the response in the parent frame.
                . _top: Opens the response in the full body of the window.
        * 8. Novalidate
            . The 'novalidate' attribute is a boolean attribute that can be 
                added to a form element to disable the browser's built-in 
                form validation.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form novalidate>
        * 9. Rel
            . The 'rel' attribute specifies the relationship between the current 
                document and the linked document or resource.
            . Browser Support
                . Chrome: Supported
                . Edge: Supported
                . Firefox: Supported
                . Internet Explorer: Supported
                . Opera: Supported
                . Safari: Supported
            . Syntax
                . <form rel="value">
            . Attribute Values
                . A space-separated list of link types that define the relationship 
                    between the current document and the linked document or resource.
-->

            h1 {

            }

            /* Down Arrow icon Styling */
            .fas.fa-arrow-down {

                display: block;
                margin: 0 auto;
                font-size: 2em;
                color: #007bff;
                animation: bounce 1s infinite;

            }

            /* Keyframes for bounce animation */
            @keyframes bounce {

                /* 0%, 20%, 50%, 80%, 100% Styling */
                0%, 20%, 50%, 80%, 100% {

                    transform: translateY(0);

                }

                /* 40% Styling */
                40% {

                    transform: translateY(-20px);

                }

                /* 60% Styling */
                60% {

                    transform: translateY(-10px);

                }

            }

            /* Form Styling */
            form {

                max-width: 400px;
                margin: 0 auto;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
                background-color: #f9f9f9;
                font-family: sans-serif; 
                box-shadow: -1px -1px 3px 1px rgba(0, 0, 0, 0.1);

                /*Hover Effect*/
                &:hover {

                    box-shadow: -1px -1px 3px 4px rgba(0, 0, 0, 0.1);

                }

            }

            /* Label Styling */
            label {

                margin-bottom: 5px;
                font-weight: bold;
                font-size: 20px;
                color: #333;
                font-size: 20px;

            }

            input, label {

                padding-left: 50px;

            }

            /* Input Styling */
            input[type="text"], input[type="email"] {

                width: 50%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                margin-left: 20px;

                /* Focus Effect */
                &:focus {

                    outline: none;
                    box-shadow: 0 0 5px #81c34f;
                    border-color: #81c34f;
                    color: #001eff;
                    transform: scale(1.10);

                }   

                /* Placeholder Styling */
                &::placeholder {

                    color: #999;
                    font-style: italic;

                }

                /*Hover Effect*/
                &:hover {

                    border-color: #81c34f;
                    box-shadow: 0 0 5px #81c34f;

                }

            }

            /* Submit Button Styling */
            input[type="submit"] {

                background-color: #007bff;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 20px;
                width: 90%;
                margin-left: 20px;

                /* Hover Effect */
                &:hover {

                    background-color: #6eb863;
                    transform: scale(0.90);

                }

                /* Focus Effect */
                &:focus {

                    outline: 5;
                    box-shadow: 0 0 30px #81c34f;
                    background-color: #81c34f;
                    transform: scale(1.05);

                }

            }
