* FIXME: 16. Class & Id
    * Class
        . The HTML class attribute is used to specify a class for an HTML element.
        . Multiple HTML elements can share the same class.
        . The class attribute is often used to point to a class name in a style sheet. 
        . It can also be used by JavaScript to access and manipulate elements 
            with the specific class name.
        . we have three <div> elements with a class attribute with 
            the value of "city". All of the three <div> elements will be 
                styled equally according to the .city style definition 
                in the head section:
        . To create a class; write a period (.) character, followed by a class name. 
            Then, define the CSS properties within curly braces {}:
    * Id
        . The HTML id attribute is used to specify a unique id for an HTML element.
        . You cannot have more than one element with the same id in an HTML document
        . The id attribute specifies a unique id for an HTML element. 
        . The value of the id attribute must be unique within the HTML document.
        . The id attribute is used to point to a specific style declaration 
            in a style sheet. 
        . It is also used by JavaScript to access and manipulate the 
            element with the specific id.
        . The syntax for id is: write a hash character (#), followed by an id name.
            Then, define the CSS properties within curly braces {}.
        . we have an <h1> element that points to the id name "myHeader". 
        . This <h1> element will be styled according to the #myHeader style 
            definition in the head section:
        . The id name is case sensitive!
        . The id name must contain at least one character, cannot start with a number, 
            and must not contain whitespaces (spaces, tabs, etc.).
-->
