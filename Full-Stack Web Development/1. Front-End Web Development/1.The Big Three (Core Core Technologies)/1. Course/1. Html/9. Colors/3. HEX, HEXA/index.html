    . HTML Colors are specified with predefined 'Basic Color Names' or with

    * 3. HEX, HEXA Color Values
        . A hexadecimal color is specified with: #RRGGBB, where the RR (red),
            GG (green) and BB (blue) hexadecimal integers specify the 
            components of the color.
        * HEX Color Values
            . In HTML, a color can be specified using a hexadecimal value in the form:
                * #rrggbb
            . Where rr (red), gg (green) and bb (blue) are hexadecimal values 
                between 00 and ff (same as decimal 0-255).
            . For example, #ff0000 is displayed as red, because red is set to its 
                highest value (ff), and the other two (green and blue) are set to 00.
            . Another example, #00ff00 is displayed as green, because green is set to
                its highest value (ff), and the other two (red and blue) are set to 00.
            . To display black, set all color parameters to 00, like this: #000000.
            . To display white, set all color parameters to ff, like this: #ffffff.
        * HEXA Color Values
            . HEXA color values are an extension of HEX color values with an alpha 
                channel - which specifies the opacity for a color. 
            . A HEXA color value is specified with: #rrggbbaa
            . The alpha parameter is a value between 00 (fully transparent) 
                and FF (not transparent at all). The value 80 indicates 50% opacity:
