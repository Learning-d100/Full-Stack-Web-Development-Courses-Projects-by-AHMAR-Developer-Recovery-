* FIXME: 18. Iframe
    . An HTML iframe is used to display a web page within a web page.
    * Syntax
        . The HTML <iframe> tag specifies an inline frame.
        . An inline frame is used to embed another document within the current 
            HTML document.
            * <iframe src="url" title="description"></iframe>
        . It is a good practice to always include a title attribute for 
            the <iframe>. 
        . This is used by screen readers to read out what the content of 
            the iframe is.
    * Set Height and Width
        . Use the height and width attributes to specify the size of the iframe.
        . The height and width are specified in pixels by default: Or you can 
            add the style attribute and use the CSS height and width properties:
    * Remove the Border
        . By default, an iframe has a border around it.
        . To remove the border, add the style attribute and use the CSS
            border property: With CSS, you can also change the size, style 
            and color of the iframe's border:
    * Target for a Link
        . An iframe can be used as the target frame for a link.
        . The target attribute of the link must refer to the name attribute 
            of the iframe:
-->
