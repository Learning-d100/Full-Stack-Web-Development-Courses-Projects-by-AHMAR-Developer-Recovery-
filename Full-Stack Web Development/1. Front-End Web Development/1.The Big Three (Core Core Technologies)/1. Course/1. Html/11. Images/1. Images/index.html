* FIXME: 11. Images
    * 1. Image:-
        . Images can improve the design and the appearance of a web page.
        * Images Syntax:-
            . The HTML <img> tag is used to embed an image in a web page.
            . Images are not technically inserted into the webpage;
                images are linked to web pages.
            . The <img> tag creates a holding space for the referenced image.
            . The <img> tag is empty, it contains attributes only and 
                does not have a closing tag.
            . the <img> tag has two required attributes:
                1. src - Specifies the path to the image
                2. alt - Sopecifies an alternate text for the image
                    * <img src="image-url" alt="alternate-text">
        * 1. The src Attribute:-
            . The required 'src' attribute specifies the path (URL) to the image.
            ? Note:-
                ? When a web page loads, it is the browser, at the moment, that 
                    ? gets the image froma web server and inserts it into the
                    ? page. 
                ? Therefore, make sure that the image acually stays in the same
                    ? spot in relation to the web page, otherwise your visitors
                    ? will get a broken link icon.
                ? The broken link icon and the 'alt' are shown if the browser 
                    ? cannot find the image.
        * 2. The alt Attribute:-
            . The required alt attribute provides an alternate text for an image,
                if the user for some reason cannot view it 
                (because of slow connection, an error in the src attribute, 
                or if the user uses a screen reader).
            . The value of the alt attribute should describe the image.
-->
