* FIXME: 5. Styles
    . The HTML style attribute is used to add styles to an element, 
        such as color, font, size, and more.
    . Setting the style of an HTML element, can be done with the style attribute.
    . The HTML style attribute has the following syntax:
        <tagname style="property:value;">
    . The property is a CSS property. The value is a CSS value.
* Background Color
    . The CSS background-color property defines the background color 
        for an HTML element.
* Text Color
    . The CSS color property defines the text color for an HTML element:
* Fonts
    . The CSS font-family property defines the font to be used for an HTML element:
* Text Size
    . The CSS font-size property defines the text size for an HTML element:
* Text Alignment
    . The CSS text-align property defines the horizontal text alignment for an 
        HTML element:
-->

        <!--Set background color for two different elements:-->
        <h1 style="background-color: blueviolet;">This is a Heading.</h1>
        <p style="background-color: brown;">This is a Paragraph.</p>

        <!--Set Text Colors of two lines-->
        <h1 style="color:blue;">This is a heading</h1>
        <p style="color:red;">This is a paragraph.</p>

        <!--Set the fonts of two different elements-->
        <h1 style="font-family:verdana;">This is a heading</h1>
        <p style="font-family:courier;">This is a paragraph.</p>

        <!--Set text size of two different elements-->
        <h1 style="font-size:300%;">This is a heading</h1>
        <p style="font-size:160%;">This is a paragraph.</p>

        <!--Set the text alignment of two different elements-->
        <h1 style="text-align:center;">Centered Heading</h1>
        <p style="text-align:right;">Centered paragraph.</p>
