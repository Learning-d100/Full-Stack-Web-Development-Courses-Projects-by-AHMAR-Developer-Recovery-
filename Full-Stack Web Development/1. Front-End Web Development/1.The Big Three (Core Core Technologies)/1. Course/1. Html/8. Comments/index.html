* FIXME: 8. Comments
    . You can add comments to your HTML source by using the following syntax:
        <! -- Write your comments here -- >
    . Notice that there is an exclamation point (!) in the start tag, but 
        not in the end tag.
    ? Note: Comments are not displayed by the browser, but they can help 
        document your HTML source code.
    . With comments you can place notifications and reminders in your HTML code:
    . Comments can be used to hide content.
    . This can be helpful if you hide content temporarily:
    . You can also hide more than one line. Everything between the
         < !- - and the - - > will be hidden from the display.
    . Comments are also great for debugging HTML, because you can comment out 
        HTML lines of code, one at a time, to search for errors.
    . Comments can be used to hide parts in the middle of the HTML code.
-->
